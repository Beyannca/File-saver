<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>IN - Sign Up</title>
</head>
<body id="In2">
    <h2><b>Create Account</b></h2>
    <div id="container">
        <input type="text" placeholder="First name" id="firstName">
        <input type="text" placeholder="Second name" id="secondName">
        <input type="number" placeholder="Age" id="age">
    </div>
    <div id="A-container">
        <input type="password" placeholder="Create Password" id="password">
        <input type="text" placeholder="Choose Username" id="username">
    </div>
    <br><br>
    <button id="Continue" onclick="Continue()">Continue</button>
    <p id="error" style="color:rgb(216, 9, 9); font-size: 13.5px;"></p>

    <script src="script.js"></script>
</body>
</html>
